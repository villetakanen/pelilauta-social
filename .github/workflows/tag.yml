name: tag

# Every merge to main deploys and is a release. The version was already bumped in
# the pull request, so the tag is derived here rather than applied by hand. An
# rerun leaves a tag on this commit alone. A tag on any other commit fails the
# release: published tags never move, and every merge needs its own version.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag the release commit
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" ]; then
              echo "$TAG already identifies this release commit."
              exit 0
            fi
            echo "::error::$TAG already identifies a different release commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
