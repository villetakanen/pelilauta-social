# Delivery gates define verification checks for changes. `run: none` marks an intentional gap.
# Cadences include in-flight during work, pre-push via lefthook, pre-merge before
# pull request merge, and release during delivery review.

gates:
  types:
    question: the TypeScript types
    run: astro check, in the app being changed
    when: [in-flight]
  lint:
    question: conformance to the linters
    run: pnpm lint
    when: [in-flight, pre-merge]
  unit:
    question: whether a function, a stylesheet contract, or generated CSS matches its tokens
    run: pnpm test
    when: [in-flight, pre-push, pre-merge]
  prose:
    question: conformance to docs/WRITING.md
    run: word-list greps from docs/WRITING.md over changed prose files
    when: [in-flight, pre-merge]
    see: docs/WRITING.md
  register:
    question: whether the prose reads as the register states
    run: the technical-writer skill over every prose file the changeset touched
    when: [pre-merge]
  component:
    question: design-system component browser behavior
    run: pnpm --filter design test:e2e
    when: [in-flight, pre-merge]
  visual:
    question: anything that can be seen
    run: the book page, read by a human
    when: [pre-merge]
  verify:
    question: branch mergeability
    run: pnpm verify
    when: [pre-merge]
  uat:
    question: release acceptance of a merge to main
    run: pnpm test:uat
    when: [release]
    cost: resets Firestore and takes ten minutes
    see: docs/ACCEPTANCE_TESTING.md
  app-e2e:
    question: pelilauta feature browser behavior
    run: none
    gap: no suite exists; apps/pelilauta/e2e is not evidence and is not run
    see: https://github.com/villetakanen/pelilauta-social/issues/120
